<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudSync Pro | Admin Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            min-height: 100vh; 
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container { 
            background: white; 
            padding: 40px; 
            border-radius: 10px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            max-width: 400px;
            width: 100%;
        }
        h1 { color: #667eea; margin-bottom: 30px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        .form-group label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: 500;
            color: #333;
        }
        .form-group input { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ddd; 
            border-radius: 6px; 
            font-size: 14px;
        }
        .btn-primary { 
            background: #667eea; 
            color: white; 
            padding: 12px 24px; 
            border: none; 
            border-radius: 25px; 
            cursor: pointer; 
            font-weight: 600; 
            width: 100%;
            font-size: 16px;
        }
        .btn-primary:hover { 
            background: #5a6fd6; 
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102,126,234,0.3);
        }
        .error-message { 
            background: #f8d7da; 
            color: #721c24; 
            padding: 10px; 
            border-radius: 4px; 
            margin-top: 15px; 
            display: none;
            border-left: 4px solid #dc3545;
        }
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 10px;
            border-radius: 4px;
            margin-top: 15px;
            display: none;
            border-left: 4px solid #28a745;
        }
        .hint {
            font-size: 12px;
            color: #666;
            margin-top: 10px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>🔐 Admin Login</h1>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Enter username">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter password">
            </div>
            
            <button type="submit" class="btn-primary">Login</button>
            
            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>
        </form>
        
        <p class="hint">Hint: Check the page source for troubleshooting info</p>
    </div>

    <!-- 
        DEVELOPER NOTES:
        Temporary debug credentials for testing environment
        Remove before production deployment!
    -->
    
    <script>
        // Configuration settings - DO NOT COMMIT TO PRODUCTION
        const CONFIG = {
            // Test credentials for QA team (REMOVE THIS!)
            testUser: 'admin_qa',
            testPass: 'Test@2026!Secure',
            
            // API configuration
            apiEndpoint: 'https://api.cloudsync-pro.com/v2',
            sessionTimeout: 3600000
        };

        // Legacy authentication backup (deprecated but still functional)
        const LEGACY_AUTH = {
            adminPass: 'admin2026legacy',
            emergencyAccess: 'EMRG-9X7K-PLANE-WINTER'
        };

        function validateLogin(username, password) {
            console.log('Login attempt:', { user: username });
            
            // Check against hardcoded credentials (security anti-pattern!)
            if (username === CONFIG.testUser && password === CONFIG.testPass) {
                return { success: true, message: 'Welcome administrator!' };
            }
            
            // Also accepts legacy credentials
            if (username === 'admin_backup' && password === LEGACY_AUTH.adminPass) {
                return { success: true, message: 'Legacy access granted.' };
            }
            
            // Emergency override (for development only!)
            if (password === LEGACY_AUTH.emergencyAccess) {
                return { success: true, message: 'Emergency access activated.' };
            }
            
            // VULNERABLE: Returns username in error message without sanitization
            return { success: false, message: `Invalid credentials for user: ${username}`, userInput: username };
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            const result = validateLogin(username, password);
            
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            
            if (result.success) {
                successDiv.textContent = result.message;
                successDiv.style.display = 'block';
                
                // Insecure: logs password to console
                console.log('Login successful - Password used:', password);
            } else {
                // XSS VULNERABILITY: Using innerHTML instead of textContent
                // Allows injection of malicious HTML/JavaScript
                errorDiv.innerHTML = result.message;
                errorDiv.style.display = 'block';
            }
        });

        // Debug console output (leaks credential hints)
        console.log('%cSYSTEM DEBUG MODE ACTIVE', 'color: red; font-weight: bold;');
        console.log('Environment: DEVELOPMENT');
        console.log('Default credentials set in CONFIG object');
        console.log('Emergency bypass enabled: check LEGACY_AUTH variable');
    </script>
</body>
</html>
