<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudSync Pro | Access Granted</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            min-height: 100vh; 
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container { 
            background: white; 
            padding: 40px; 
            border-radius: 10px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h1 { color: #667eea; margin-bottom: 20px; }
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 20px;
            border-radius: 6px;
            margin: 30px 0;
            border-left: 4px solid #28a745;
            font-size: 18px;
            font-weight: 600;
        }
        .icon {
            font-size: 48px;
            margin-bottom: 20px;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .hint {
            font-size: 12px;
            color: #666;
            margin-top: 30px;
            font-style: italic;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="icon">✓</div>
        <h1>Access Granted</h1>
        
        <div class="success-message">
            Logged in as Admin.<br>You found the security flaw!
        </div>
        
        <a href="https://s-cpu3.github.io/findthesecurityflaws/" class="back-link">← Back to Login</a>
        
        <p class="hint">
            Congratulations! The security flaw is Insufficient Authentication!
        </p>
    </div>
</body>
</html>
